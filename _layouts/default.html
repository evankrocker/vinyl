<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ site.baseurl }}/">
      <i class="bi bi-vinyl me-2"></i>{{ site.title }}
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}"
             href="{{ site.baseurl }}/">Collection</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page.url contains 'artists' %}active{% endif %}"
             href="{{ site.baseurl }}/artists.html">Artists</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page.url contains 'stats' %}active{% endif %}"
             href="{{ site.baseurl }}/stats.html">Stats</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if page.url contains 'add' %}active{% endif %}"
             href="{{ site.baseurl }}/add.html">
            <i class="bi bi-plus-circle me-1"></i>Add Record
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  {{ content }}
</main>

<footer class="border-top mt-5 py-3 text-center text-muted small bg-light">
  <div class="container">
    {{ site.title }} &mdash; {{ site.description }}
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Embed the full record collection as JSON for client-side use
  window.RECORDS = {{ site.data.records | jsonify }};
  window.BASE_URL = "{{ site.baseurl }}";
</script>
<script src="{{ site.baseurl }}/assets/js/main.js"></script>
{% if page.page_script %}
<script src="{{ site.baseurl }}/assets/js/{{ page.page_script }}"></script>
{% endif %}
</body>
</html>
