---
layout: default
title: "Collection"
page_script: "index.js"
---

<div class="d-flex align-items-center justify-content-between mb-4">
  <h1 class="page-header mb-0">
    <i class="bi bi-collection me-2"></i>My Collection
    <span class="badge bg-secondary fs-6 ms-2" id="totalBadge"></span>
  </h1>
  <div class="d-flex gap-2 align-items-center">
    <input type="search" id="searchBox" class="form-control form-control-sm"
           placeholder="Search albums, artists…" />
    <div class="btn-group btn-group-sm" role="group">
      <input type="radio" class="btn-check" name="viewMode" id="viewTable" checked />
      <label class="btn btn-outline-secondary" for="viewTable"><i class="bi bi-table"></i></label>
      <input type="radio" class="btn-check" name="viewMode" id="viewGrid" />
      <label class="btn btn-outline-secondary" for="viewGrid"><i class="bi bi-grid-3x3-gap"></i></label>
    </div>
  </div>
</div>

<!-- Table view -->
<div id="tableView">
  <div class="table-responsive">
    <table class="table table-hover align-middle" id="recordsTable">
      <thead class="table-dark">
        <tr>
          <th></th>
          <th data-sort="title">Title</th>
          <th data-sort="artist">Artist</th>
          <th data-sort="genre">Genre</th>
          <th data-sort="year">Year</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Grid view -->
<div id="gridView" class="d-none">
  <div class="row g-3" id="gridBody"></div>
</div>
