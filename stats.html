---
layout: default
title: "Stats"
page_script: "stats.js"
---

<h1 class="page-header">
  <i class="bi bi-bar-chart-fill me-2"></i>Collection Stats
</h1>

<!-- Top-level counts -->
<div class="row g-3 mb-5">
  <div class="col-6 col-md-3">
    <div class="card stat-card p-3 h-100">
      <div class="detail-label">Total Records</div>
      <div class="stat-number" id="statTotal">—</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card stat-card p-3 h-100">
      <div class="detail-label">Artists</div>
      <div class="stat-number" id="statArtists">—</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card stat-card p-3 h-100">
      <div class="detail-label">Genres</div>
      <div class="stat-number" id="statGenres">—</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card stat-card p-3 h-100">
      <div class="detail-label">Year Span</div>
      <div class="stat-number" id="statYears">—</div>
    </div>
  </div>
</div>

<div class="row g-4">
  <!-- By Artist -->
  <div class="col-md-6">
    <h4 class="mb-3"><i class="bi bi-person me-2"></i>Records by Artist</h4>
    <div class="table-responsive">
      <table class="table table-sm table-hover" id="artistTable">
        <thead class="table-dark">
          <tr>
            <th data-sort="artist">Artist</th>
            <th data-sort="count" class="text-end">Count</th>
          </tr>
        </thead>
        <tbody id="artistStatsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- By Genre -->
  <div class="col-md-6">
    <h4 class="mb-3"><i class="bi bi-music-note-list me-2"></i>Records by Genre</h4>
    <div class="table-responsive">
      <table class="table table-sm table-hover" id="genreTable">
        <thead class="table-dark">
          <tr>
            <th data-sort="genre">Genre</th>
            <th data-sort="count" class="text-end">Count</th>
          </tr>
        </thead>
        <tbody id="genreStatsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- By Year -->
  <div class="col-12">
    <h4 class="mb-3"><i class="bi bi-calendar3 me-2"></i>Records by Release Year</h4>
    <div class="table-responsive">
      <table class="table table-sm table-hover" id="yearTable">
        <thead class="table-dark">
          <tr>
            <th data-sort="year">Year</th>
            <th data-sort="count" class="text-end">Count</th>
            <th>Albums</th>
          </tr>
        </thead>
        <tbody id="yearStatsBody"></tbody>
      </table>
    </div>
  </div>
</div>
