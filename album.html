---
layout: default
title: "Album"
page_script: "album.js"
---

<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ site.baseurl }}/">Collection</a></li>
    <li class="breadcrumb-item"><a href="#" id="breadcrumbArtistLink">…</a></li>
    <li class="breadcrumb-item active" id="breadcrumbAlbum">…</li>
  </ol>
</nav>

<div id="albumDetail" class="d-none">
  <div class="row g-4">
    <!-- Cover -->
    <div class="col-md-4 col-lg-3">
      <div class="detail-cover" id="coverWrap"></div>
      <div class="mt-3 d-grid">
        <a href="#" class="btn btn-outline-secondary btn-sm" id="backToArtist">
          <i class="bi bi-arrow-left me-1"></i>All albums by <span id="backArtistName"></span>
        </a>
      </div>
    </div>

    <!-- Info -->
    <div class="col-md-8 col-lg-9">
      <h1 class="mb-1" id="albumTitle"></h1>
      <h4 class="text-muted mb-3" id="albumArtist"></h4>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="detail-label">Year</div>
          <div class="detail-value" id="albumYear"></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="detail-label">Genre</div>
          <div class="detail-value" id="albumGenre"></div>
        </div>
      </div>

      <div id="albumNotesWrap" class="d-none">
        <div class="detail-label mb-1">Notes</div>
        <div class="card bg-light border-0 p-3">
          <p class="mb-0" id="albumNotes"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="notFound" class="d-none text-center py-5">
  <i class="bi bi-exclamation-circle display-4 text-muted"></i>
  <p class="mt-3 text-muted">Album not found.</p>
  <a href="{{ site.baseurl }}/" class="btn btn-outline-secondary">Back to Collection</a>
</div>
